[project]
name = "simple-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BasileKoko", email = "basile_koko@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain",
    "chromadb",
    "sentence-transformers",
    "fastapi",
    "uvicorn",
    "google",
    "google-genai",
    "dotenv",
    "langchain_text_splitters",
    "langchain_docling",
    "docling-slim[format-markdown]",
    "langchain_huggingface",
    "langchain_chroma",
    "protobuf>=7.36.2",
]

[project.scripts]
simple-rag = "simple_rag:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
